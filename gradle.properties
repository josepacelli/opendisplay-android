org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0+ has built-in Kotlin support: the standalone org.jetbrains.kotlin.android
# plugin is no longer compatible with it (confirmed empirically against AGP 9.2.0 —
# applying it crashes with a ClassCastException in KGP's own compat-check, even
# with the documented android.builtInKotlin=false opt-out). Built-in Kotlin it is;
# see app/build.gradle.kts for how Compose/jvmToolchain are configured under it.
