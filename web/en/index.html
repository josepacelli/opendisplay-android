<script type="application/ld+json">

  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is this the same app as OpenDisplay for iOS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It's an independent client, written from scratch in Kotlin, that implements the same network protocol to interoperate with the original Mac app. The official project only ships an iOS/iPadOS client."
      }
    },
    {
      "@type": "Question",
      "name": "Is it on Google Play?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Google Play version is currently in closed testing. Meanwhile, it's distributed via GitHub Releases — install it with adb install or by copying the APK to the device (enable unknown sources)."
      }
    },
    {
      "@type": "Question",
      "name": "Does it need WiFi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It works over WiFi with automatic mDNS discovery. You can also connect over USB as a native accessory (AOA) — plug the cable and tap the system's prompt, no adb required. That native USB path currently needs a development fork of the Mac app; against the published Mac app, USB works through an adb-forward fallback covered in the repository."
      }
    },
    {
      "@type": "Question",
      "name": "Does it work on any Android tablet or phone?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Requires Android 8.0 (API 26) or higher. Tested on real hardware (Samsung Galaxy Tab S9 FE+ and Galaxy Note10+/Tab S7+, Android 12 through 16), but not yet across a wide range of devices."
      }
    },
    {
      "@type": "Question",
      "name": "Does it change anything on the Mac app?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No modification whatsoever — any protocol mismatch is this project's responsibility, not upstream's."
      }
    },
    {
      "@type": "Question",
      "name": "What's the license?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0, same as the original project. Open source, free to use including commercially; distributed modified versions must remain open source under the same license."
      }
    }
  ]
}
