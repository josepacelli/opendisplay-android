<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "É o mesmo app que o OpenDisplay para iOS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Não. É um cliente independente, escrito do zero em Kotlin, que implementa o mesmo protocolo de rede para interoperar com o app original do Mac. O projeto oficial só disponibiliza um cliente para iOS/iPadOS."
      }
    },
    {
      "@type": "Question",
      "name": "Está na Google Play?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A versão da Google Play está atualmente em teste fechado. Enquanto isso, é distribuída pelo GitHub Releases — instale com adb install ou copiando o APK pro aparelho (ative fontes desconhecidas)."
      }
    },
    {
      "@type": "Question",
      "name": "Precisa de WiFi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Funciona via WiFi com descoberta automática por mDNS. Também dá pra conectar via USB como acessório nativo (AOA) — pluga o cabo e toca no aviso do sistema, sem precisar de adb. Esse caminho USB nativo hoje exige um fork de desenvolvimento do app de Mac; contra o app de Mac publicado, o USB funciona via um fallback com adb forward, coberto no repositório."
      }
    },
    {
      "@type": "Question",
      "name": "Funciona em qualquer tablet ou celular Android?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Requer Android 8.0 (API 26) ou superior. Testado em hardware real (Samsung Galaxy Tab S9 FE+ e Galaxy Note10+/Tab S7+, Android 12 a 16), mas ainda não numa gama ampla de aparelhos."
      }
    },
    {
      "@type": "Question",
      "name": "Muda alguma coisa no app de Mac?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nenhuma modificação — qualquer incompatibilidade de protocolo é responsabilidade deste projeto, não do projeto original."
      }
    },
    {
      "@type": "Question",
      "name": "Qual é a licença?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0, igual ao projeto original. Open source, uso livre inclusive comercial; versões modificadas distribuídas precisam continuar open source sob a mesma licença."
      }
    }
  ]
}
