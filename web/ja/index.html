      "acceptedAnswer": {
        "@type": "Answer",
        "text": "いいえ。これはKotlinでゼロから書かれた独立クライアントで、オリジナルのMacアプリと相互運用するために同じネットワークプロトコルを実装しています。公式プロジェクトが提供しているのはiOS/iPadOSクライアントのみです。"

      "@type": "Question",
      "name": "Google Playにありますか？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google Play版は現在クローズドテスト中です。それまでは、GitHub Releasesで配布しています — adb installでインストールするか、APKを端末にコピーしてインストールしてください（提供元不明のアプリを許可）。"
      }
    },
    {
      "@type": "Question",
      "name": "WiFiは必要ですか？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "mDNSによる自動検出でWiFi経由で動作します。USBでネイティブアクセサリ（AOA）として接続することもできます — ケーブルを挿してシステムのプロンプトをタップするだけで、adbは不要です。このネイティブUSB経路は現状Macアプリの開発フォークが必要です。公開されているMacアプリに対しては、リポジトリに記載のadb-forwardフォールバックでUSBが使えます。"
      }
    },
    {
      "@type": "Question",
      "name": "どのAndroidタブレットやスマホでも動きますか？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Android 8.0（API 26）以上が必要です。実機（Samsung Galaxy Tab S9 FE+、Galaxy Note10+/Tab S7+、Android 12〜16）でテスト済みですが、幅広い機種での検証はまだです。"
      }
    },
    {
      "@type": "Question",
