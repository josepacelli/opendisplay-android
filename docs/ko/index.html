    {
      "@type": "Question",
      "name": "iOS용 OpenDisplay와 같은 앱인가요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "아닙니다. Kotlin으로 처음부터 새로 작성된 독립 클라이언트로, 오리지널 Mac 앱과 상호운용하기 위해 동일한 네트워크 프로토콜을 구현했습니다. 공식 프로젝트는 iOS/iPadOS 클라이언트만 제공합니다."
      }
    },
    {
      "@type": "Question",
      "name": "Google Play에 있나요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google Play 버전은 현재 비공개 테스트 중입니다. 그동안은 GitHub Releases로 배포됩니다 — adb install로 설치하거나 APK를 기기에 복사해서 설치하세요 (출처를 알 수 없는 앱 허용 필요)."
      }
    },
    {
      "@type": "Question",
      "name": "WiFi가 꼭 필요한가요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "mDNS 자동 검색으로 WiFi를 통해 동작합니다. USB로 네이티브 액세서리(AOA)로 연결할 수도 있습니다 — 케이블을 꽂고 시스템 프롬프트를 누르기만 하면 되며 adb는 필요 없습니다. 이 네이티브 USB 경로는 현재 Mac 앱의 개발 포크가 필요합니다. 공식 배포된 Mac 앱에서는 저장소에 안내된 adb-forward 대체 방법으로 USB를 사용할 수 있습니다."
      }
    },
    {
      "@type": "Question",
      "name": "아무 Android 태블릿이나 폰에서 동작하나요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Android 8.0(API 26) 이상이 필요합니다. 실제 기기(Samsung Galaxy Tab S9 FE+, Galaxy Note10+/Tab S7+, Android 12~16)에서 테스트했지만, 아직 다양한 기기에서 폭넓게 검증되지는 않았습니다."
      }
    },
    {
      "@type": "Question",
      "name": "Mac 앱에 어떤 변경이라도 가하나요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "전혀 변경하지 않습니다 — 프로토콜 불일치가 있다면 그것은 업스트림이 아닌 이 프로젝트의 책임입니다."
      }
    },
    {
      "@type": "Question",
      "name": "라이선스는 무엇인가요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0, 오리지널 프로젝트와 동일합니다. 오픈소스이며 상업적 사용을 포함해 자유롭게 사용할 수 있습니다. 배포되는 수정 버전도 동일한 라이선스로 오픈소스를 유지해야 합니다."
