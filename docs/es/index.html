  "mainEntity": [
    {
      "@type": "Question",
      "name": "¿Es la misma app que OpenDisplay para iOS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Es un cliente independiente, escrito desde cero en Kotlin, que implementa el mismo protocolo de red para interoperar con la app original de Mac. El proyecto oficial solo distribuye un cliente para iOS/iPadOS."
      }
    },
    {
      "@type": "Question",
      "name": "¿Está en Google Play?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La versión de Google Play está actualmente en pruebas cerradas. Mientras tanto, se distribuye por GitHub Releases — instálala con adb install o copiando el APK al dispositivo (activa los orígenes desconocidos)."
      }
    },
    {
      "@type": "Question",
      "name": "¿Necesita WiFi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Funciona por WiFi con descubrimiento automático por mDNS. También puedes conectar por USB como accesorio nativo (AOA) — conecta el cable y acepta el aviso del sistema, sin necesitar adb. Esa vía USB nativa hoy requiere un fork de desarrollo de la app de Mac; contra la app de Mac publicada, el USB funciona mediante un fallback con adb forward, explicado en el repositorio."
      }
    },
    {
      "@type": "Question",
      "name": "¿Funciona en cualquier tablet o teléfono Android?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Requiere Android 8.0 (API 26) o superior. Probado en hardware real (Samsung Galaxy Tab S9 FE+ y Galaxy Note10+/Tab S7+, Android 12 a 16), pero todavía no en una gama amplia de dispositivos."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cambia algo en la app de Mac?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ninguna modificación — cualquier desajuste de protocolo es responsabilidad de este proyecto, no del proyecto original."
      }
    },
    {
      "@type": "Question",
      "name": "¿Cuál es la licencia?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0, igual que el proyecto original. Código abierto, de uso libre incluso comercial; las versiones modificadas distribuidas deben seguir siendo de código abierto bajo la misma licencia."
      }
    }
  ]
