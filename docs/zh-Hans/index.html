<script type="application/ld+json">

  "mainEntity": [
    {
      "@type": "Question",
      "name": "这和 iOS 版 OpenDisplay 是同一个应用吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "不是。这是一个独立客户端，用 Kotlin 从零编写，实现了相同的网络协议以便和原版 Mac 应用互通。官方项目只提供 iOS/iPadOS 客户端。"
      }
    },
    {
      "@type": "Question",
      "name": "有上架 Google Play 吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google Play 版本目前处于封闭测试阶段。与此同时，可以通过 GitHub Releases 获取 — 用 adb install 安装，或把 APK 复制到设备上安装（需开启未知来源）。"
      }
    },
    {
      "@type": "Question",
      "name": "必须要 WiFi 吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "通过 WiFi 使用 mDNS 自动发现即可运行。也可以用 USB 作为原生配件（AOA）连接 — 插上数据线，点一下系统弹窗即可，无需 adb。目前这条原生 USB 路径需要 Mac 应用的开发分支；对着已发布的 Mac 应用，USB 通过仓库中说明的 adb-forward 回退方案实现。"
      }
    },
    {
      "@type": "Question",
      "name": "所有安卓平板或手机都能用吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "需要安卓 8.0（API 26）或更高版本。已在真实设备上测试（三星 Galaxy Tab S9 FE+ 和 Galaxy Note10+/Tab S7+，安卓 12 至 16），但尚未覆盖广泛的机型。"
      }
    },
    {
      "@type": "Question",
      "name": "会改动 Mac 应用吗？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "完全不做任何修改 — 任何协议不兼容都是本项目的责任，与上游项目无关。"
      }
    },
    {
      "@type": "Question",
      "name": "许可证是什么？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0，与原项目相同。开源，可自由使用，包括商用；分发的修改版必须以同一许可证继续开源。"
      }
    }
  ]
}
