  "mainEntity": [
    {
      "@type": "Question",
      "name": "É a mesma aplicação que o OpenDisplay para iOS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Não. É um cliente independente, escrito de raiz em Kotlin, que implementa o mesmo protocolo de rede para interoperar com a aplicação original do Mac. O projeto oficial só disponibiliza um cliente para iOS/iPadOS."
      }
    },
    {
      "@type": "Question",
      "name": "Está na Google Play?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A versão da Google Play está atualmente em teste fechado. Entretanto, é distribuída pelo GitHub Releases — instale com adb install ou copiando o APK para o dispositivo (ative origens desconhecidas)."
      }
    },
    {
      "@type": "Question",
      "name": "Precisa de WiFi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Funciona por WiFi com descoberta automática por mDNS. Também é possível ligar por USB como acessório nativo (AOA) — ligue o cabo e aceite o aviso do sistema, sem precisar de adb. Esse caminho USB nativo hoje exige um fork de desenvolvimento da aplicação de Mac; contra a aplicação de Mac publicada, o USB funciona através de um fallback com adb forward, explicado no repositório."
      }
    },
    {
      "@type": "Question",
      "name": "Funciona em qualquer tablet ou telemóvel Android?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Requer Android 8.0 (API 26) ou superior. Testado em hardware real (Samsung Galaxy Tab S9 FE+ e Galaxy Note10+/Tab S7+, Android 12 a 16), mas ainda não numa gama ampla de dispositivos."
      }
    },
    {
      "@type": "Question",
      "name": "Altera alguma coisa na aplicação de Mac?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nenhuma modificação — qualquer incompatibilidade de protocolo é responsabilidade deste projeto, não do projeto original."
      }
    },
    {
      "@type": "Question",
      "name": "Qual é a licença?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GPL-3.0, igual ao projeto original. Open source, uso livre inclusive comercial; versões modificadas distribuídas têm de continuar open source sob a mesma licença."
      }
    }
  ]
